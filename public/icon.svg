<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景 -->
  <rect width="512" height="512" rx="80" fill="#1a0a2e"/>
  
  <!-- 筒の本体 -->
  <rect x="156" y="200" width="200" height="220" rx="16" fill="#2c1654" stroke="#d4af37" stroke-width="5"/>
  
  <!-- 筒の上フタ -->
  <rect x="140" y="185" width="232" height="30" rx="10" fill="#d4af37"/>
  
  <!-- 棒3本（筒から出ている） -->
  <rect x="218" y="80" width="18" height="130" rx="9" fill="#f5e6c8"/>
  <rect x="247" y="60" width="18" height="150" rx="9" fill="#f5e6c8"/>
  <rect x="276" y="75" width="18" height="135" rx="9" fill="#f5e6c8"/>
  
  <!-- 漢字「御籤」 -->
  <text x="256" y="295" font-family="serif" font-size="64" fill="#d4af37" text-anchor="middle" font-weight="bold">御</text>
  <text x="256" y="375" font-family="serif" font-size="64" fill="#d4af37" text-anchor="middle" font-weight="bold">籤</text>

  <!-- 底部の飾り線 -->
  <rect x="156" y="400" width="200" height="12" rx="6" fill="#d4af37"/>

  <!-- 装飾の点 -->
  <circle cx="110" cy="120" r="5" fill="#d4af37" opacity="0.5"/>
  <circle cx="400" cy="120" r="5" fill="#d4af37" opacity="0.5"/>
  <circle cx="90" cy="380" r="5" fill="#d4af37" opacity="0.5"/>
  <circle cx="420" cy="380" r="5" fill="#d4af37" opacity="0.5"/>
</svg>
